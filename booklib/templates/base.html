<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Библиотека</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background:#f5f5f7; color:#222; }
  header { background:#2b2b33; color:#fff; padding:12px 20px; display:flex; gap:16px; align-items:center;}
  header a { color:#fff; text-decoration:none; }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:16px; }
  .tile { background:#fff; border-radius:8px; padding:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); display:flex; flex-direction:column; }
  .tile img { width:100%; height:220px; object-fit:cover; border-radius:4px; background:#eee;}
  .tile .t { font-weight:600; margin-top:8px; font-size:14px; line-height:1.2;}
  .tile .a { color:#666; font-size:12px; margin-top:2px;}
  .badge { display:inline-block; padding:1px 6px; border-radius:8px; font-size:11px; background:#e6e6ef; margin-top:4px;}
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar input, .toolbar select, .toolbar button { padding:6px 10px; border-radius:6px; border:1px solid #ccc; font-size:14px;}
  button.primary { background:#3b6ef5; color:#fff; border:none; cursor:pointer;}
</style>
</head>
<body>
<header>
  <a href="/"><b>📚 Библиотека</b></a>
  <a href="/missing">Пропавшие</a>
  <span style="flex:1"></span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
